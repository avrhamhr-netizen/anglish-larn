<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק טנקים - חזית הפלדה</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background: #2e3d2f;
            display: block;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="ui">מטבעות: <span id="coinCount">0</span></div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const coinCountEl = document.getElementById('coinCount');

    // הגדרת מכשיר מגע מחוץ לאובייקט המדינה - תיקון השגיאה!
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    let dbState = {
        coins: 0,
        unlockedSkins: ["classic"],
        activeSkin: "classic",
        unlockedHulls: ["classic"],
        activeHull: "classic",
        unlockedTurrets: ["classic"],
        activeTurret: "classic",
        unlockedMinions: [],
        activeMinion: "none",
        upgrades: { armor: 0, engine: 0, turret: 0 }
    };

    // אובייקט הטנק של השחקן
    let tank = {
        x: 400,
        y: 300,
        size: 40,
        angle: 0,
        speed: 4
    };

    // ניהול מקשים לקלט
    let keys = {};
    window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

    // לולאת המשחק הראשית
    function gameLoop() {
        update();
        render();
        requestAnimationFrame(gameLoop);
    }

    // עדכון מיקום הטנק בהתאם למקשים
    function update() {
        if (keys['w'] || keys['arrowup']) tank.y -= tank.speed;
        if (keys['s'] || keys['arrowdown']) tank.y += tank.speed;
        if (keys['a'] || keys['arrowleft']) tank.x -= tank.speed;
        if (keys['d'] || keys['arrowright']) tank.x += tank.speed;

        // חסימת יציאה מגבולות המסך
        if (tank.x < tank.size) tank.x = tank.size;
        if (tank.x > canvas.width - tank.size) tank.x = canvas.width - tank.size;
        if (tank.y < tank.size) tank.y = tank.size;
        if (tank.y > canvas.height - tank.size) tank.y = canvas.height - tank.size;
    }

    // ציור המשחק על המסך
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // ציור הטנק (ריבוע פשוט להמחשה)
        ctx.fillStyle = '#4CAF50';
        ctx.fillRect(tank.x - tank.size/2, tank.y - tank.size/2, tank.size, tank.size);
        
        // קנה הטנק
        ctx.fillStyle = '#388E3C';
        ctx.fillRect(tank.x - 5, tank.y - tank.size, 10, tank.size);
    }

    // הפעלת המשחק
    gameLoop();
</script>

</body>
</html>
